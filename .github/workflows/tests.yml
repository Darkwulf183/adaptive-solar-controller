name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit-Tests (ohne Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python-Syntax prüfen
        run: python -m compileall -q custom_components
      - name: Tests ausführen
        run: python -m unittest discover -s tests -v
      - name: Panel-Syntax prüfen
        run: node --check custom_components/adaptive_solar_controller/frontend/asc-panel.js
