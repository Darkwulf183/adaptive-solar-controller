    - type: sensor
      graph: line
      entity: sensor.solar_yield_overview
      detail: 1
    - type: sensor
      graph: line
      entity: sensor.solar_yield_year
      detail: 1
      hours_to_show: 240
  - type: heading
    heading: Inverter Steuerung
    icon: mdi:power-plug-battery
  - type: entities
    state_color: true
    entities:
    - entity: sensor.input_solar_power
      name: Solar Leistung
    - entity: number.apsystems_apsystems_1_max_output_power
      name: Inverter 1
    - entity: number.ez1_backup_apsystems_ez1_backup_max_output_power
      name: Backup Inverter
    - entity: switch.input_solar
    - entity: input_number.inverter_target_power
      name: Sollleistung
    - entity: input_number.battery_voltage_high
      name: Akku obere Grenze
    - entity: input_number.battery_voltage_low
      name: Akku untere Grenze
    - entity: input_number.inverter_max_limit
      name: Inverter Limit
  - type: heading
    heading: ASC v0.4.4 · Estimator → Planner → Fast Controller
    icon: mdi:brain
  - type: markdown
    content: >
      {% set status = states('sensor.adaptive_solar_controller_controller_state') %}
      {% set plan = states('sensor.adaptive_solar_controller_battery_energy_budget_state') %}
      {% set reason = states('sensor.adaptive_solar_controller_energy_planner_reason') %}
      {% set grid = states('sensor.e320_power_in') | float(0) %}
      {% set target = states('input_number.inverter_target_power') | float(0) %}
      {% set limit = states('sensor.adaptive_solar_controller_effective_inverter_limit') | float(0) %}
      {% set reserve = states('sensor.adaptive_solar_controller_estimated_battery_reserve') | float(0) %}
      {% set reserve_target = states('sensor.adaptive_solar_controller_target_reserve_at_next_pv_charge') | float(0) %}
      ## 🧠 ASC v0.4.4 · {{ status }}
      **Netz:** {{ grid|round(0) }} W · **Soll:** {{ target|round(0) }} W · **Planner-Limit:** {{ limit|round(0) }} W

      **Planner:** {{ plan }} · {{ reason }}

      **Akku-Reserve:** {{ reserve|round(1) }} % → **Ziel am nächsten PV-Start:** {{ reserve_target|round(1) }} %
  - type: horizontal-stack
    cards:
    - type: tile
      entity: switch.input_solar
      name: Solar Freigabe
      icon: mdi:solar-power
    - type: tile
