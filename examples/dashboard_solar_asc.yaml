  - type: heading
    heading: ASC v0.4.4 · Strategy Learner
    icon: mdi:chart-bell-curve-cumulative
  - type: horizontal-stack
    cards:
    - type: tile
      entity: select.adaptive_solar_controller_battery_chemistry
