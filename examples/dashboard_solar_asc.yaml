type: sections
max_columns: 3
title: Solar
path: solar
sections:
- type: grid
  cards:
  - type: heading
    heading: Solar Anlage
    icon: mdi:solar-power
  - type: entities
    title: ASC v0.4.6 · FULL Absorptionszeit
    show_header_toggle: false
    entities:
      - entity: sensor.adaptive_solar_controller_full_absorption_elapsed
        name: Gesammelte Absorptionszeit
      - entity: number.adaptive_solar_controller_full_absorption_required
        name: Eingestellte Absorptionszeit
      - entity: sensor.adaptive_solar_controller_full_absorption_remaining
        name: Verbleibende Absorptionszeit
      - entity: sensor.adaptive_solar_controller_full_absorption_status
        name: Zeitstatus
      - entity: sensor.adaptive_solar_controller_full_anchor_source
        name: Letzter FULL-Anker
  - type: entities
    title: ASC v0.4.6 · LOW-Recovery und Sicherheit
    show_header_toggle: false
    entities:
      - entity: select.adaptive_solar_controller_low_recovery_calibration_mode
        name: LOW-Recovery Modus
      - entity: sensor.adaptive_solar_controller_low_recovery_status
        name: Kalibrierstatus
      - entity: sensor.adaptive_solar_controller_low_recovery_step
        name: Stufe
      - entity: sensor.adaptive_solar_controller_low_recovery_phase
        name: Messphase
      - entity: sensor.adaptive_solar_controller_low_recovery_remaining
        name: Verbleibende Zeit
      - entity: sensor.adaptive_solar_controller_low_recovery_successful_runs
        name: Erfolgreiche Durchläufe
      - entity: sensor.adaptive_solar_controller_rebound_valid_power_bins
        name: Rückfederung · gültige Lastbereiche
      - entity: number.adaptive_solar_controller_battery_hard_cutoff_voltage
        name: Harte Unterspannungsgrenze
      - entity: sensor.adaptive_solar_controller_battery_hard_cutoff_status
        name: Abschaltstatus
  - type: markdown
    content: >
      {% set a = states('sensor.solar_complete_ampere') | float(0) %}
      {% set v = states('sensor.solar_average_voltage') | float(0) %}
      {% set elevation = state_attr('sun.sun','elevation') | float(0) %}
      {% if a > 2 %}
      ## ☀️ Akku lädt **+{{ a | round(1) }} A · {{ ((a*v)/1000) | round(2) }} kW**
      {% elif a < -1 %}
      ## 🌙 Akku entlädt **{{ (-a) | round(1) }} A · {{ (((-a)*v)/1000) | round(2) }} kW**
      {% else %}
      ## 🔋 Akku nahezu ausgeglichen **{{ a | round(1) }} A**
      {% endif %}
      🔋 {{ v | round(2) }} V · ☀️ Sonnenstand {{ elevation | round(1) }}°
  - type: statistics-graph
    entities:
    - sensor.solar_complete_ampere
    - sensor.sun_solar_elevation
    title: Sun & Strom
    days_to_show: 7
    period: 5minute
    chart_type: line
    stat_types: [mean]
  - type: horizontal-stack
    cards:
    - type: custom:modern-circular-gauge
      entity: sensor.solar_average_voltage
      name: Akku
      unit: V
      min: 21
      max: 30
      smooth_segments: true
      adaptive_state_color: true
      adaptive_icon_color: true
      adaptive_label_color: true
      gauge_foreground_style: {width: 10, color: adaptive}
      gauge_background_style: {width: 2, color: adaptive}
      segments:
      - from: 0
        color: [255, 0, 0]
      - from: 23.16
        color: [252, 161, 3]
      - from: 23.8
        color: [43, 255, 0]
      show_graph: true
      header_position: top
    - type: custom:modern-circular-gauge
      entity: sensor.solar_complete_ampere
      name: Akku Strom
      unit: A
      min: -40
      max: 120
      smooth_segments: true
      adaptive_state_color: true
      adaptive_icon_color: true
      adaptive_label_color: true
      gauge_foreground_style: {width: 10, color: adaptive}
      gauge_background_style: {width: 2, color: adaptive}
      segments:
      - from: -40
        color: [0, 0, 255]
      - from: 0
        color: [255, 0, 0]
      - from: 10
        color: [252, 161, 3]
      - from: 20
        color: [43, 255, 0]
      show_graph: true
      header_position: top
    - type: custom:modern-circular-gauge
      entity: sensor.solar_akku_entladeleistung
      name: Entladeleistung
      unit: kW
      min: 0
      max: 3
      smooth_segments: true
      adaptive_state_color: true
      adaptive_icon_color: true
      adaptive_label_color: true
      gauge_foreground_style: {width: 10, color: adaptive}
      gauge_background_style: {width: 2, color: adaptive}
      segments:
      - from: 0
        color: [0, 255, 0]
      - from: 1
        color: [255, 255, 0]
      - from: 2
        color: [255, 128, 0]
      - from: 2.7
        color: [255, 0, 0]
      show_graph: true
      header_position: top
  - type: custom:modern-circular-gauge
    entity: sensor.e320_power_in
    name: Netz / Solar
    secondary:
      entity: sensor.input_solar_power
      unit: W
      show_gauge: inner
      state_size: small
      gauge_radius: 40
      max: 1600
      adaptive_label_color: true
      adaptive_state_color: true
      gauge_foreground_style: {width: 5}
      segments:
      - from: 0
        color: [200, 200, 0]
    min: -1000
    max: 10000
    smooth_segments: true
    adaptive_state_color: true
    adaptive_label_color: true
    gauge_foreground_style: {width: 5}
    segments:
    - from: -1000
      color: [0, 255, 0]
    header_position: bottom
    show_graph: false

  - type: custom:modern-circular-gauge
    name: EPEVER Load
    entity: sensor.epever_tracer_1_load_current
    unit: A
    min: 0
    max: 40
    smooth_segments: true
    adaptive_state_color: true
    adaptive_label_color: true
    show_icon: false
    secondary:
      entity: sensor.epever_tracer_2_load_current
      unit: A
      show_gauge: inner
      min: 0
      max: 40
      smooth_segments: true
      adaptive_state_color: true
      adaptive_label_color: true
      segments:
      - from: 0
        color:
        - 0
        - 255
        - 0
      - from: 25
        color:
        - 255
        - 128
        - 64
      - from: 35
        color:
        - 255
        - 0
        - 0
    segments:
    - from: 0
      color:
      - 0
      - 255
      - 0
    - from: 25
      color:
      - 255
      - 128
      - 64
    - from: 35
      color:
      - 255
      - 0
      - 0
  - type: heading
    heading: Akku Entladephase
    icon: mdi:battery-arrow-down
  - type: markdown
    grid_options:
      columns: 12
      rows: 4
    content: "{% set phase = is_state('input_boolean.solar_entladephase','on') %} {% set ah = states('sensor.solar_entladephase_ah') | float(0) %} {% set kwh = states('sensor.solar_entladephase_kwh') | float(0) %} {% set a = states('sensor.solar_akku_entladestrom') | float(0) %} {% set kw = states('sensor.solar_akku_entladeleistung') | float(0) %} {% set startv = states('input_number.solar_entladephase_startspannung') | float(0) %} {% set nowv = states('sensor.solar_average_voltage') | float(0) %}\n\n{% if phase %} ## 🌙 Entladephase läuft\n\n**Aktuell:** {{ a | round(1) }} A · {{ kw | round(2) }} kW\n\n**Seit PV-Ende:** {{ ah | round(1) }} Ah · {{ kwh | round(2) }} kWh\n\n**Start:** {{ states('input_datetime.solar_entladephase_start') }}\n\n**Spannung:** {{ startv | round(2) }} V → {{ nowv | round(2) }} V\n\n**Vorherige Nacht:** {{ states('input_number.solar_letzte_entladung_ah') }} Ah · {{ states('input_number.solar_letzte_entladung_kwh') }} kWh\n\n{% else %} ## ☀️ Keine Entladephase\n\n**Letzte Entladephase:** {{ ah | round(1) }} Ah · {{ kwh | round(2) }} kWh\n\n**Startspannung:** {{ startv | round(2) }} V\n\n🔋 Aktuell {{ nowv | round(2) }} V {% endif %}"
  - type: horizontal-stack
    cards:
    - type: tile
      entity: sensor.solar_entladephase_ah
      name: Entnommen
      icon: mdi:battery-minus
    - type: tile
      entity: sensor.solar_entladephase_kwh
      name: Energie
      icon: mdi:lightning-bolt
  - type: horizontal-stack
    cards:
    - type: tile
      entity: sensor.solar_akku_entladestrom
      name: Entladung
      icon: mdi:current-dc
    - type: tile
      entity: sensor.solar_akku_entladeleistung
      name: Leistung
      icon: mdi:flash
  - type: heading
    heading: Energie
    icon: mdi:chart-line
  - type: horizontal-stack
    cards:
    - type: sensor
      graph: line
      detail: 2
      entity: sensor.solar_tageserzeugung
      name: Erzeugung heute
      icon: mdi:solar-power
    - type: sensor
      graph: line
      detail: 2
      entity: sensor.solar_tagesverbrauch
      name: Verbrauch heute
      icon: mdi:home-lightning-bolt
  - type: horizontal-stack
    cards:
    - type: sensor
      graph: line
      detail: 2
      entity: sensor.solar_jahreserzeugung
      name: Erzeugung Jahr
      hours_to_show: 240
      icon: mdi:solar-power
    - type: sensor
      graph: line
      detail: 2
      entity: sensor.solar_jahresverbrauch
      name: Verbrauch Jahr
      hours_to_show: 240
      icon: mdi:home-lightning-bolt
  - type: horizontal-stack
