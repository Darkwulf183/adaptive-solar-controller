      Akku {{ batt|round(2) }} kWh · Netz {{ grid|round(2) }} kWh · aktuelle Phase {{ current|round(2) }} kWh

      _v0.4.4 lernt bewusst den Gesamtbedarf und nicht mehr nur die Batterieentnahme._
